[project]
name = "scaspa-chatbot-backend"
version = "0.1.0"
description = "Backend for the SCASPA AI assistant — cargo, cruise, ferry and airport information for St. Kitts."
requires-python = ">=3.11"

# Versions are pinned exactly. They were verified against the current LangChain v1
# documentation and PyPI on 2026-07-29; see docs/decisions.md entry 0001.
dependencies = [
    "fastapi==0.140.13",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.1.1",
    # LangChain v1 — agent entry point is langchain.agents.create_agent
    "langchain==1.3.14",
    "langchain-core==1.5.2",
    # Separate package in v1: `langchain` does not depend on it, so the web
    # chunker's RecursiveCharacterTextSplitter needs it declared explicitly.
    "langchain-text-splitters==1.1.2",
    "langchain-openai==1.4.1",
    "langchain-chroma==1.1.0",
    "langgraph==1.2.10",
    "chromadb==1.5.9",
    "openai==2.50.0",
    # Knowledge-base CSV loading
    "pandas==3.0.5",
    # Scraper + HTTP client
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations — type hints everywhere (CLAUDE.md Style)
    "ASYNC",
]
ignore = [
    "ANN401",  # allow typing.Any where a boundary genuinely accepts anything
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "openai: test performs a real OpenAI API call; skipped when OPENAI_API_KEY is unset",
]
