# Fly.io deployment. See docs/deploy.md — do NOT deploy with fixture data.
app = "scaspa-chatbot"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  PORT = "8000"
  LOG_LEVEL = "INFO"
  CHROMA_DIR = "/data/chroma"
  # Set to the real frontend origin before going live. A wildcard with ENV=prod
  # makes the app refuse to boot, by design.
  ALLOWED_ORIGINS = "http://localhost:5173"

# OPENAI_API_KEY is a secret: fly secrets set OPENAI_API_KEY=...

[[mounts]]
  source = "scaspa_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  # SSE must not be buffered or streaming is pointless.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
