<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Ask about ferries, cruise arrivals, cargo and Robert L. Bradshaw International Airport in St. Kitts. Answers come from verified SCASPA information and cite their source."
    />
    <!-- Preload the one font file. Inter is a variable font, so every weight the
         UI uses lives in this single 48KB file — "preload only the body weight"
         collapses into "preload the one file". See public/fonts/README.md.
         crossorigin is required even same-origin: a font is a CORS-mode fetch,
         and without it the browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Framing policy is NOT here, deliberately.
         <meta http-equiv="X-Frame-Options"> has never been supported, and CSP's
         frame-ancestors is explicitly ignored when delivered by <meta>. A tag
         here would look like a control and enforce nothing, which is worse than
         no tag: it closes the checklist item and leaves the site framable.
         The real control is a response header set by the deploy.
         See frontend/docs/embedding.md. -->
    <title>SCASPA Assistant</title>
  </head>
  <body>
    <!-- Users are on phones on expensive roaming data. If JavaScript fails they
         still need the phone number, so it is in the HTML rather than rendered. -->
    <noscript>
      <div style="padding: 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>SCASPA Assistant</h1>
        <p>This assistant needs JavaScript. You can reach SCASPA directly:</p>
        <p><strong>Telephone: 869-465-8121 / 2 / 3</strong></p>
        <p>P.O. Box 963, Bird Rock, Basseterre, St. Kitts</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
