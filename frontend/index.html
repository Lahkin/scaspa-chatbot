<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The Pilot mark, alone and without the wordmark, as the spec asks.

         One SVG rather than a 16/32/48/192/512 raster set: it scales to whatever
         a browser asks for and costs a fraction of the bytes, which matters on a
         product that self-hosts its font to save a single DNS round trip. The
         file carries its own prefers-color-scheme block, because browser chrome
         has a light and a dark of its own that has nothing to do with the app's
         data-theme — and a navy compass on a dark tab strip is an empty tab. -->
    <link rel="icon" type="image/svg+xml" href="/pilot-mark.svg" />
    <meta
      name="description"
      content="Ask about ferries, cruise arrivals, cargo and Robert L. Bradshaw International Airport in St. Kitts. Answers come from verified SCASPA information and cite their source."
    />
    <!-- Preload the one font file. Inter is a variable font, so every weight the
         UI uses lives in this single 48KB file — "preload only the body weight"
         collapses into "preload the one file". See public/fonts/README.md.
         crossorigin is required even same-origin: a font is a CORS-mode fetch,
         and without it the browser downloads the file twice. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Framing policy is NOT here, deliberately.
         <meta http-equiv="X-Frame-Options"> has never been supported, and CSP's
         frame-ancestors is explicitly ignored when delivered by <meta>. A tag
         here would look like a control and enforce nothing, which is worse than
         no tag: it closes the checklist item and leaves the site framable.
         The real control is a response header set by the deploy.
         See frontend/docs/embedding.md. -->
    <title>Pilot | SCASPA Digital Guide</title>
    <!-- The theme, before the first frame.

         This has to be a blocking inline script and it has to be here. The
         palette lives in CSS as a :root[data-theme='dark'] block, so something
         must put that attribute on <html> before anything paints. React cannot:
         by the time a module script has been fetched, parsed and hydrated, a
         reader on a dark phone has already been shown a white page. That flash
         is the single most obvious sign of a theme bolted on afterwards.

         Deliberately duplicated logic, not shared with features/theme: this
         runs before any module loads, so it cannot import. It is kept to the
         two facts it needs — the storage key and the attribute — and the store
         writes the same attribute again the moment it initialises, which makes
         a drift between the two visible immediately rather than subtly.

         Wrapped in try/catch because localStorage throws outright in Safari
         private mode, and a preference must never be able to stop the page. -->
    <script>
      (function () {
        try {
          var stored = null;
          try {
            var raw = localStorage.getItem('scaspa.prefs');
            if (raw) stored = JSON.parse(raw).theme;
          } catch (e) {
            /* private mode, a locked-down kiosk: fall through to the system */
          }
          var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Users are on phones on expensive roaming data. If JavaScript fails they
         still need the phone number, so it is in the HTML rather than rendered. -->
    <noscript>
      <div style="padding: 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Pilot — SCASPA Digital Guide</h1>
        <p>Pilot needs JavaScript. You can reach SCASPA directly:</p>
        <p><strong>Telephone: 869-465-8121 / 2 / 3</strong></p>
        <p>P.O. Box 963, Bird Rock, Basseterre, St. Kitts</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
