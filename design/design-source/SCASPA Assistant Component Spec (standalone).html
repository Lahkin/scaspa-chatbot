tate(180deg)\"><use href=\"#i-chev-d\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr auto;gap:16px;padding:12px 20px;align-items:center;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">vessels.search<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">name \"Vega Sirius\", limit 25<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">240 ms<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr auto;gap:16px;padding:12px 20px;align-items:center;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">berths.positions<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">port BAS, complete set<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">110 ms<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr auto;gap:16px;padding:12px 20px;align-items:center\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">advisories.list<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">active only, 2 returned<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">1.59 s<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Populated and real. Tool name, a one-line argument summary and a duration — no request bodies, no responses. Collapsed on arrival every time; it is evidence, not part of the answer.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Grounding correction<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px 0;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\">\n          <svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#D9A23B\">Two figures were replaced<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The rates first drafted could not be matched to the published tariff. The values below come from the tariff table.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Wharfage on a 40ft import container is XCD 186.00, and the security levy is XCD 24.00. Both are per container, per call.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"14\" style=\"color:#6E7490\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">Tariff schedule in force 1 April 2026<\u002Fspan><\u002Fdiv>\n        <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Open the tariff table<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\">\n        <svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg>\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 13px/18px Inter,sans-serif;color:#D9A23B\">Cannot ship — needs answer_replaced on the response<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The client has no reliable flag for a corrected answer, so it cannot tell a replaced figure from an original one. Showing the note on every answer would be a lie; showing it on none hides the correction. Hold the component until the field exists.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">No answer — not in our data<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px 8px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">We don't hold that information<\u002Fspan>\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Cargo insurance is not part of the port record. What we do hold is vessel movements, flight arrivals, port tariffs and departmental contacts.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:46px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">See all vessel movements<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:46px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Check flight arrivals<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:46px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Open the tariff table<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:46px;margin-bottom:8px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Contact a department<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The only card that carries all four destinations. It is a statement about coverage, so it offers the whole of what is covered.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Question too complex<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">That took more steps than we can run in one go<\u002Fspan>\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Try asking for one thing at a time. Splitting the question usually gets an answer straight away.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:#1E2137;border:1px solid #262A42\">\n          <span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Ask this instead<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-spark\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;flex:1\">Which vessels are alongside at Basseterre today?<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-arr-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\">\n        <svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg>\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 13px/18px Inter,sans-serif;color:#D9A23B\">Cannot ship — needs a distinct step_limit_reached signal<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Today this arrives as the same generic failure as \"not in our data\". Telling a user to simplify a question we simply do not cover sends them round in circles.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Rate limited — HTTP 429<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Too many questions in a short time<\u002Fspan>\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">The assistant has paused this session. Your question is still in the box — send it again when the countdown ends.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:#1E2137;border:1px solid #262A42\">\n          <div style=\"width:40px;height:40px;border-radius:999px;background:conic-gradient(#5457BE 0deg 252deg, #262A42 252deg 360deg);display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:30px;height:30px;border-radius:999px;background:#1E2137;display:flex;align-items:center;justify-content:center;color:#A5A7E6\"><svg width=\"14\" height=\"14\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">0:42<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">until you can ask again<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:10px;background:#1E2137;border:1px solid #262A42;color:#6E7490\"><span style=\"font:500 14px/22px Inter,sans-serif\">Send again<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The countdown is the whole component — seconds from Retry-After, ticking down, and a disabled send that enables at zero. No questions-remaining counter, no quota meter: the backend exposes nothing else.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\">\n        <svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg>\n        <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 13px/18px Inter,sans-serif;color:#D9A23B\">Cannot ship — needs Retry-After exposed to the client<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The header is sent but not listed in Access-Control-Expose-Headers, so the browser cannot read it. Without the number the card can only say \"try again shortly\", which is the one thing a countdown exists to avoid.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Data source status card\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">06<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Data source status card<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Sits where the promo card sits in the reference — pinned above the user row, 216px inside the 240px sidebar.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Fixture data — default in testing<\u002Fdiv>\n      <div style=\"width:216px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Sample data — not live<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Figures come from the test fixture. Do not quote them to a customer.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Live<\u002Fdiv>\n      <div style=\"width:216px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#3B9BD9;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Live data<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Refreshed 14:32 AST<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Unavailable<\u002Fdiv>\n      <div style=\"width:216px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9564B;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Data unavailable<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Last known 06:10 AST, 1 Aug<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;min-width:340px;background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Notes<\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Fixture and unavailable are the two states to expect in practice. The card never says \"everything is fine\" — live simply states when it last refreshed, and the user draws their own conclusion from the time.<\u002Fp>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Unavailable keeps the last-known timestamp rather than hiding it. A shipping agent needs to know whether the stale figure is an hour old or a day old.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"07 Status chips\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">07<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Status chips<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">The full enumerations, including the values today's fixtures never produce.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"18\" height=\"18\" style=\"color:#7A7CD6\"><use href=\"#i-ship\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Vessels<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(217,162,59,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">Expected<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Caution — the arrival is estimated, not confirmed.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(59,167,118,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Alongside<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Positive — berthed and working.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:#1E2137;border:1px solid #262A42\"><span style=\"width:7px;height:7px;border-radius:999px;background:#6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Departed<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Settled and closed — a fact, not an alert. No status hue.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:transparent;border:1px dashed #262A42\"><span style=\"width:7px;height:7px;border-radius:999px;border:1.5px solid #6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Unknown<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">—<\u002Fspan><\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B\">Not in fixtures<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"18\" height=\"18\" style=\"color:#7A7CD6\"><use href=\"#i-plane\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Flights<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:#1E2137;border:1px solid #262A42\"><span style=\"width:7px;height:7px;border-radius:999px;background:#6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Scheduled<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Filed and unremarkable. No hue until something changes.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(59,167,118,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Landed<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">On the ground.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(59,167,118,0.12)\"><svg width=\"12\" height=\"12\" style=\"color:#3BA776\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Arrived<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">At stand, complete — tick instead of a dot, so it reads apart from landed.<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B;flex:none\">Not in fixtures<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(217,162,59,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">Delayed<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Caution.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(217,86,75,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#D9564B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">Cancelled<\u002Fspan><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Critical. Label raised to the #E4736A tint for 5.7:1.<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B;flex:none\">Not in fixtures<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Anatomy<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:24px\">\n        <span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(59,167,118,0.12)\"><span style=\"width:7px;height:7px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Alongside<\u002Fspan><\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:3px;font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\"><span>26px tall · 12px side padding · full pill<\u002Fspan><span>7px dot · 7px gap · 12/16 medium label<\u002Fspan><span>fill at 12% · dot and label at full strength<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Why unknown is drawn, not guessed<\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Unknown is a real value and it means the record has no status — not that the vessel is late, and not that it is fine. It gets a hollow dot, an em dash where a value would be, a dashed outline instead of a fill, and no status hue at all. Rendering it as \"Expected\" or leaving the cell blank would both be inventions.<\u002Fp>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Three of the nine values never appear in current test data. They are drawn here at full fidelity because production will produce them, and a chip that has never been rendered is a chip nobody has checked.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"08 Contact card and 09 Tariff quote\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:grid;grid-template-columns:1fr 1.6fr;gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;align-items:baseline;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">08<\u002Fdiv>\n        <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Contact card<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">As it ships — status absent, collapsed<\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px 8px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Marine Operations<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">Berthing, pilotage and vessel scheduling<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Telephone<\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">+1 869 465 8121<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Post<\u002Fspan><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Port Zante, P.O. Box 963<br>Basseterre, St Kitts<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Contact a department<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Reference only — the slot that never fills<\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px dashed #262A42;border-radius:16px;padding:20px 24px;display:flex;flex-direction:column;gap:12px;opacity:0.65\">\n          <div style=\"font:600 16px/24px Inter,sans-serif;color:#6E7490\">Marine Operations<\u002Fdiv>\n          <div style=\"height:26px;border-radius:999px;border:1px dashed #262A42;display:flex;align-items:center;padding:0 12px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">location status — always empty<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The status line is not rendered with an em dash, a \"—\" placeholder or a reserved gap. When the field is empty the element is not in the tree, so the postal block moves up against the telephone block and the card simply becomes shorter. Telephone and post are the only two channels; there is no email row, no extension, no web form.<\u002Fp>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;align-items:baseline;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">09<\u002Fdiv>\n        <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Tariff quote<\u002Fh2>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">A total that silently loses its largest line is the worst outcome in this product.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Complete<\u002Fdiv>\n          <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n            <div style=\"padding:20px 24px 16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Quote — MV Vega Sirius<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">12,000 GT · 12 × 40ft import · 18 hours alongside<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;padding:0 24px\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Tonnage dues<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">12,000 GT at 0.42<\u002Fspan><\u002Fdiv><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric s:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Ask about a vessel, a flight, a tariff or a department…<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"width:34px;height:34px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">2 · Typing<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #383A97;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">What is wharfage on a 40ft import container<span style=\"color:#A5A7E6\">|<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">42/1000<\u002Fspan><div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"width:34px;height:34px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">3 · At the limit — 1000<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #D9A23B;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Please confirm the berthing window, pilotage booking and tonnage dues for MV Vega Sirius on its next call…<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">1000 characters is the maximum<\u002Fspan><div style=\"flex:1\"><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">1000/1000<\u002Fspan><div style=\"width:34px;height:34px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:colum 2Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">4/1000<\u002Fspan><div style=\"width:34px;height:34px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">6 · Disabled while streaming<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Answering…<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #1E2137;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;border:1px solid #262A42\"><span style=\"width:8px;height:8px;border-radius:2px;background:#A3A8C0\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Stop<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">7 · Disabled — rate limited<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Which vessels are alongside at Basseterre?<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(217,162,59,0.12)\"><svg width=\"14\" height=\"14\" style=\"color:#D9A23B\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">15 questions a minute is the limit. Send again in 0:42.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #1E2137;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"width:34px;height:34px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#6E7490;font:600 12px/16px Inter,sans-serif;font-variant-numeric:tabular-nums\">42<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">8 · Disabled — search index missing<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Ask about a vessel, a flight, a tariff or a department…<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(217,86,75,0.12)\"><svg width=\"14\" height=\"14\" style=\"color:#E4736A;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The assistant cannot search its records at the moment, so it cannot answer. Vessels, flights and tariffs still work — or telephone 869 465 8121.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #1E2137;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"width:34px;height:34px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Category chips — 5, with the 422 rejection<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#383A97;font:500 13px/18px Inter,sans-serif;color:#FFFFFF\"><svg width=\"12\" height=\"12\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Berthing<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:28px;padding:0 14px flex-wrap:wrap\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-style:italic\">Untitled source<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#D9A23B;font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#22245E\">Changes often<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;border:1px dashed #6E7490;font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#A3A8C0\">No check date<\u002Fspan><\u002Fdiv>\n            <span style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">No extract available for this source.<\u002Fspan>\n            <span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Scraped page · no link recorded<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Chip 2 carries every null at once: <span style=\"color:#A3A8C0\">label: null<\u002Fspan> falls back to \"Untitled source\" and never to the id, <span style=\"color:#A3A8C0\">snippet: null<\u002Fspan> says so rather than inventing an extract, <span style=\"color:#A3A8C0\">source_url: \"\"<\u002Fspan> removes the link entirely, and <span style=\"color:#A3A8C0\">volatility: null<\u002Fspan> renders as \"changes often\" — the cautious end, never as static.<\u002Fp>\n      <div style=\"display:flex;gap:12px\">\n        <div style=\"flex:1;background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Source list · 1<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Single row, no header count.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Source list · 2–5<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">\"4 sources\" header, numbered to match the inline markers.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;background:#171A2B;border:1px dashed #262A42;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Source list · empty<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Section removed. An empty \"Sources\" heading implies one is loading.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"15 Refusals and errors\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">15<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board C — refusals, escalation, errors, speak<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Five refusals that must not look alike, and the escalation block that follows every one of them.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">1 · Safety — vessel or aircraft operations<\u002Fspan>\n      <div style=\"background:#171A2B;border:1px solid rgba(217,86,75,0.35);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#E4736A\"><use href=\"#i-shield\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">This assistant cannot advise on operations<\u002Fspan><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Berthing, pilotage, manoeuvring and aircraft handling are decided by duty officers with live information this assistant does not have. Telephone Marine Operations.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">2 · Personal record<\u002Fspan>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">We do not hold records about people<\u002Fspan><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">This assistant holds published information only — schedules, tariffs and departmental contacts. It cannot look up a person, a consignment owner or a staff member.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">3 · Low confidence — no answer<\u002Fspan>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">We don't hold that information<\u002Fspan><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Nothing in the published record covers cargo insurance. What we do hold is vessel movements, flight arrivals, port tariffs and departmental contacts.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">4 · Tool cap reached<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-tool\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">That took more steps than we can run in one go<\u002Fspan><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Ask for one thing at a time and it will usually answer straight away.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#1E2137;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-spark\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Which vessels are alongside today?<\u002Fspan><svg width=\"14\" height=\"14\" style=\"color:#A5A7E6\"><use href=\"#i-arr-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><svg width=\"14\" height=\"14\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\"><span style=\"color:#D9A23B;font-weight:600\">Needs a distinct refusal_category or hit_tool_limit.<\u002Fspan> Cards 3 and 4 arrive byte-identical today, so the client cannot tell \"simplify it\" from \"we don't have it\".<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">5 · Ungrounded figure replaced<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#D9A23B\">Two figures were replaced<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The rates first drafted could not be matched to the published tariff.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Wharfage on a 40ft import container is XCD 186.00, and the security levy is XCD 24.00.<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><svg width=\"14\" height=\"14\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\"><span style=\"color:#D9A23B;font-weight:600\">Needs answer_replaced on ResponseMeta.<\u002Fspan> String-matching the message is the only detection available today and it is fragile.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Escalation block — appended to every refusal and every error<\u002Fspan>\n      <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Speak to the Authority<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:10px;border:1px solid #262A42;color:#A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;font-variant-numeric:tabular-nums\">869 465 8121 / 8122 / 8123<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:0 2px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:4px\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">P.O. Box 963, Bird Rock, Basseterre, St Kitts<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Identical wherever it appears. A refusal that ends without a way forward is a dead end.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n      <div style=\"padding:18px 24px;border-bottom:1px solid #262A42;display:flex;align-items:baseline;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Eight error envelopes<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Each names what happened and what to do about it<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:10px 24px;border-bottom:1px solid #262A42\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Code<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Heading<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Body<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">400<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">We could not read that request<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Something in the question was malformed. Retype it and send again.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">404<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">Page not found<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">We could not find that page. Check the address, or go back and ask the assistant.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">413<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">That file is too large<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The recording was 26 MB. The limit is 20 MB. Record a shorter clip.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">422<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">We could not use that<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Names the field and the actual limit it hit — never a generic \"invalid input\".<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">429<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">Too many questions in a short time<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Countdown from Retry-After. Your question stays in the box.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums\">500<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">Something went wrong at our end<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Try again. If it keeps happening, telephone 869 465 8121.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;border-bottom:1px solid #262A42;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums\">503<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">This part of the service is off<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Voice is unavailable. You can still type your question.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1.1fr 2fr;gap:16px;padding:12px 24px;align-items:baseline\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums\">504<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">That took too long<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The record did not answer in time. Try a narrower question.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Speak button — 7 states<\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-wave\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Idle<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;background:#1E2137;display:flex;align-items:center;justify-content:center;color:#F2F3F8\"><svg width=\"16\" height=\"16\"><use href=\"#i-wave\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Hover<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#F2F3F8;box-shadow:0 0 0 2px #171A2B, 0 0 0 4px #A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-wave\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Focus<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:32px;height:32px;border-radius:10px;background:rgba(56,58,151,0.35);display:flex;align-items:center;justify-content:center;color:#A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Preparing<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex px Inter,sans-serif;color:#A3A8C0\">Answer time<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">4.02 s<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Records searched<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">1,284<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Rate-limit keys tracked<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">37<\u002Fspan><\u002Fdiv>\n          <span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Hashed keys, not users, visitors or addresses.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"16 Structured blocks\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">16<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board D — structured blocks inside a chat turn<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Every one of these is an operations payload, so every one carries a meta strip. The chart caption is never collapsed.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-tran display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Unpriced code — see also section 09<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 20px;background:#1E2137;border-bottom:1px solid #262A42\"><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#5457BE\"><svg width=\"12\" height=\"12\" style=\"color:#FFFFFF\"><use href=\"#i-chart\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#FFFFFF\">Calculated<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"padding:0 20px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Wharfage<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">12 containers at 186.00<\u002Fspan><\u002Fdiv><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">2,232.00<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Berthage<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">code BTH-18 is not in the table<\u002Fspan><\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(217,86,75,0.12);flex:none\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9564B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">Not priced<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:0 20px 14px;padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35);display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#E4736A;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">This quote is incomplete. Berthage has no published rate, so the total below is less than the amount payable.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:14px 20px;border-top:1px solid #262A42;background:#1E2137;display:flex;align-items:baseline;justify-content:space-between;gap:14px\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Total so far<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">1 charge missing<\u002Fspan><\u002Fdiv><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">XCD 2,232.00<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 20px;border-top:1px solid #262A42;background:rgba(217,162,59,0.12)\"><span style=\"font:400 13px/20px Inter,sans-serif;color:#F2F3F8\">An estimate worked out from the published schedule. It is not an invoice and the Authority confirms all charges on billing.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><svg width=\"14\" height=\"14\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\"><span style=\"color:#D9A23B;font-weight:600\">Needs unpriced: list[str] on TariffQuote.<\u002Fspan> build_quote computes unpriced codes and discards them, so today the total silently loses its largest component and the standard disclaimer does not cover that.<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"19 Support\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">19<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board G — Support<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">The form asks for nothing about the person. That absence has to be explained or it reads as broken.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Emergency strip — always present, never a standing red alarm<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:12px;background:#1E2137;border:1px solid #262A42\">\n      <div style=\"width:32px;height:32px;border-radius:999px;background:rgba(217,86,75,0.12);display:flex;align-items:center;justify-content:center;color:#E4736A;flex:none\"><svg width=\"16\" height=\"16\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">In an emergency, telephone the port at once — do not use this form<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Enquiries sent here are read during office hours only.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:10px;background:#D9564B;color:#0A0B14;flex:none\"><svg width=\"16\" height=\"16\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:600 14px/22px Inter,sans-serif;font-variant-numeric:tabular-nums\">869 465 8121<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n    <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">A neutral strip with one red element — the button that actually dials. A bar that is red on every visit teaches people to look past it, and then it is not there when it matters.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Location cards — five, with empty fields collapsing<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Deep Water Port<\u002Fspan><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">869 465 8121<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Bird Rock, Basseterre<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Port Zante<\u002Fspan><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">869 466 5021<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Port Zante, Basseterre<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">R. L. Bradshaw Airport<\u002Fspan><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">869 465 8472<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Golden Rock, Basseterre<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Vance W. Amory Airport<\u002Fspan><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">869 469 9040<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Charlestown Port<\u002Fspan><div style=\"display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6;margin-top:3px\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;font-variant-numeric:tabular-nums\">869 469 5521<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px dashed #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;opacity:0.7\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#6E7490\">The two slots that never fill<\u002Fspan><div style=\"height:22px;border-radius:999px;border:1px dashed #262A42;display:flex;align-items:center;padding:0 10px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">address: \"\" — element not rendered<\u002Fspan><\u002Fdiv><div style=\"height:22px;border-radius:999px;border:1px dashed #262A42;display:flex;align-items:center;padding:0 10px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">status: \"\" — element not rendered<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Cards 4 and 5 have no address on file, so the postal row is absent from the tree — no em dash, no reserved gap, no empty label. The card is simply shorter and still reads as complete.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Contact point rows — all 5 kinds<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:12px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-phone\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6;flex:1;font-variant-numeric:tabular-nums\">869 465 8121<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(59,167,118,0.12);font:600 11px/16px Inter,sans-serif;color:#3BA776\">Populated<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-pin\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8;flex:1\">P.O. Box 963, Bird Rock<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(59,167,118,0.12);font:600 11px/16px Inter,sans-serif;color:#3BA776\">Populated<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;opacity:0.6\"><svg width=\"16\" height=\"16\" style=\"color:#6E7490\"><use href=\"#i-file\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490;flex:1\">Email<\
