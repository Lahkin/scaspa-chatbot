u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B\">Open TODO<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;opacity:0.6\"><svg width=\"16\" height=\"16\" style=\"color:#6E7490\"><use href=\"#i-headset\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490;flex:1\">Extension<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,86,75,0.12);font:600 11px/16px Inter,sans-serif;color:#E4736A\">Never<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;opacity:0.6\"><svg width=\"16\" height=\"16\" style=\"color:#6E7490\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490;flex:1\">Web<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B\">Not populated<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Row types drawn, three unpopulated. No staff extension directory will be built — a caller routed to the wrong security gate extension is worse off than one who was never offered the number.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#7A7CD6\"><use href=\"#i-shield\"><\u002Fuse><\u002Fsvg><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Why we ask for so little<\u002Fspan><\u002Fdiv>\n        <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">This form takes no name, no email address, no telephone number and no attachment. The Authority does not hold an account for you, and nothing you send here is linked to a person. Quote the reference when you telephone.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Transcript checkbox — the UI reflects the response<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><div style=\"width:18px;height:18px;border-radius:5px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:none;margin-top:2px\"><svg width=\"12\" height=\"12\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Requested: attach this conversation<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:#1E2137;border:1px solid rgba(217,162,59,0.3)\"><div style=\"width:18px;height:18px;border-radius:5px;border:1px solid #262A42;flex:none;margin-top:2px\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#D9A23B\">Not attached<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The conversation could not be attached to this enquiry. The department will see your message only.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The box shows what the server did, not what the user asked for. A tick that means \"we tried\" is the kind of thing people discover at the worst moment.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"20 Console and health\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">20<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board H — Console, health, admin<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">An empty map is the normal state. An empty advisory list is not an all-clear.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Vessel positions — empty is normal<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;background:#1E2137;border-bottom:1px solid #262A42\"><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#6E7490\"><svg width=\"12\" height=\"12\" style=\"color:#0A0B14\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#0A0B14\">No feed<\u002Fspan><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Position reporting<\u002Fspan><\u002Fdiv>\n        <div style=\"height:200px;background:#10121F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-bottom:1px solid #262A42;background-image:linear-gradient(#171A2B 1px, transparent 1px), linear-gradient(90deg, #171A2B 1px, transparent 1px);background-size:32px 32px\">\n          <svg width=\"24\" height=\"24\" style=\"color:#6E7490\"><use href=\"#i-map\"><\u002Fuse><\u002Fsvg>\n          <span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">No positions are being reported<\u002Fspan>\n          <span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;max-width:300px;text-align:center\">No AIS receiver is connected to this assistant. Positions appear here only when one is.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Marker by reported_by<\u002Fspan>\n          <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:16px;height:16px;border-radius:999px;background:#3B9BD9;border:2px solid #0A0B14;box-shadow:0 0 0 2px #3B9BD9;flex:none\"><\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">AIS fix<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">solid, ringed<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:16px;height:16px;border-radius:4px;background:#5457BE;flex:none\"><\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Operator entry<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">square, solid<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:16px;height:16px;border-radius:999px;border:1.5px dashed #D9A23B;flex:none\"><\u002Fspan><div style=\"display:flex;flex-direction:column\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Estimated<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">hollow, dashed<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:16px;padding-top:10px;border-top:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Heading<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">not reported<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Speed<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">not reported<\u002Fspan><\u002Fdiv><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;flex:1\">Null heading draws no arrow at all. Null speed is never 0 knots — that would say the vessel is stopped.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Gates — 4 statuses, server counter<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #262A42;display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Gate assignments<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">2 active of 8<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n          <div style=\"padding:12px;border-radius:12px;background:#1E2137;border:1px solid rgba(59,167,118,0.35);display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Gate 1<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;border:1px solid rgba(59,167,118,0.45);align-self:flex-start\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Open<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px;border-radius:12px;background:#1E2137;border:1px solid rgba(59,155,217,0.35);display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Gate 4<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;border:1px solid rgba(59,155,217,0.45);align-self:flex-start\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3B9BD9\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3B9BD9\">Boarding<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px;border-radius:12px;background:#1E2137;border:1px solid #262A42;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Gate 5<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;border:1px solid #262A42;align-self:flex-start\"><span style=\"width:6px;height:6px;border-radius:999px;background:#6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Closed<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px;border-radius:12px;background:#1E2137;border:1px dashed #262A42;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Gate 6<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;border:1px dashed #6E7490;align-self:flex-start\"><span style=\"width:6px;height:6px;border-radius:999px;border:1.5px solid #6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Unassigned<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 16px;border-top:1px solid #262A42\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">The active count comes from the server. It is never recomputed from the visible rows, which would drop to zero under a filter.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Marine advisories — the empty state that matters<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #262A42;display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Advisories<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">0 in total<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:24px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:rgba(217,162,59,0.12);border-bottom:1px solid #262A42\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><svg width=\"16\" height=\"16\" style=\"color:#D9A23B\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">No notice has been published to this assistant<\u002Fspan><\u002Fdiv>\n          <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">That is not confirmation that conditions are normal. Telephone Marine Operations on 869 465 8121 before sailing.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Severity, when populated<\u002Fspan>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(59,155,217,0.45)\"><svg width=\"12\" height=\"12\" style=\"color:#3B9BD9\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#3B9BD9\">Notice<\u002Fspan><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(217,162,59,0.45)\"><svg width=\"12\" height=\"12\" style=\"color:#D9A23B\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">Warning<\u002Fspan><\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(217,86,75,0.45);background:rgba(217,86,75,0.12)\"><svg width=\"12\" height=\"12\" style=\"color:#E4736A\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">Urgent<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The only empty state in the product drawn in caution rather than neutral. A quiet screen read as safety has physical consequences here.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Operator profile — demo, and null<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:32px;height:32px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#7A7CD6;flex:none\"><svg width=\"16\" height=\"16\"><use href=\"#i-anchor\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Basseterre operator<\u002Fspan><\u002Fdiv><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#D9A23B;font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#22245E\">Demo only<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Active · verified<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Active · unverified<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;background:#6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Inactive · verified<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:999px;border:1.5px solid #6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Inactive · unverified<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">A fixed demonstration object. It is not a sign-in, not an account and never becomes one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px dashed #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">profile: null — production<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The card is not rendered. No placeholder, no \"sign in\" prompt, no silhouette avatar.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Health — ok, and two distinct degradations<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><span style=\"width:8px;height:8px;border-radius:999px;background:#3BA776;flex:none\"><\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;flex:1\">All parts of the service are responding<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9A23B;flex:none;margin-top:7px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Search is unavailable<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The assistant cannot answer questions. Vessels, flights and tariffs still work.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9A23B;flex:none;margin-top:7px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Voice is switched off<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Speaking and listening are unavailable. You can still type your question.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Two causes, two messages. \"Degraded\" alone tells a user nothing about whether the thing they came for still works.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Index status — ready: false<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:14px 16px;border-bottom:1px solid #262A42;display:flex;align-items:center;gap:10px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Search index not ready<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Documents<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#6E7490\">unknown<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Chunks<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#6E7490\">unknown<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Built<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#6E7490\">unknown<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Version<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">v4.2.0<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 16px;border-top:1px solid #262A42;border-style:dashed none none\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">The version string is the only visible trace of the offline scripts. No rebuild control, no progress, no job status.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Every field reads \"unknown\", never 0. Zero documents is a fact about an index that was built; this index has not reported at all.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Admin — gate, models, config<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Administrator key<\u002Fspan>\n        <div style=\"height:38px;padding:0 12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;align-items:center\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#6E7490\">••••••••••••<\u002Fspan><\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;justify-content:center;height:38px;border-radius:10px;background:#383A97;color:#FFFFFF;font:500 14px/22px Inter,sans-serif\">Continue<\u002Fdiv>\n        <span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Reached only by typing the address. A wrong key returns the ordinary 404, the same as a mistyped URL.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;display:flex;align-items:center;gap:8px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Models in use<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:#262A42;font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#A3A8C0\">Admin only<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Chat<\u002Fspan><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#F2F3F8\">claude-sonnet-4-6<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Embedding<\u002Fspan><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#F2F3F8\">text-embed-3<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:9px 16px\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Chat limit<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">15 / minute<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Spend tiles — with the unpriced case<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px\">\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Chat<\u002Fspan><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">412.60<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Embedding<\u002Fspan><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">88.20<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Voice<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 20px/28px Inter,sans-serif;color:#6E7490\">—<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">no price configured<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">A 0.00 in a spend tile may mean \"unpriced\", not \"free\" — prices default to zero until configured, so an unconfigured category shows an em dash and says why.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Breakdown and history — caveat always shown<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px\"><div style=\"width:77.5%;background:#5457BE\"><\u002Fdiv><div style=\"width:16.6%;background:#7A7CD6\"><\u002Fdiv><div style=\"width:5.9%;background:#A5A7E6\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#5457BE\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Chat<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">412.60<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#7A7CD6\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Embedding<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">88.20<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:10px;height:10px;border-radius:3px;background:#A5A7E6\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Voice<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">31.40<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:6px;height:56px;padding-top:8px;border-top:1px solid #262A42\">\n          <div style=\"flex:1;height:40%;background:#262A42;border-radius:3px 3px 0 0\"><\u002Fdiv><div style=\"flex:1;height:56%;background:#262A42;border-radius:3px 3px 0 0\"><\u002Fdiv><div style=\"flex:1;height:48%;background:#262A42;border-radius:3px 3px 0 0\"><\u002Fdiv><div style=\"flex:1;height:72%;background:#262A42;border-radius:3px 3px 0 0\"><\u002Fdiv><div style=\"flex:1;height:64%;background:#262A42;border-radius:3px 3px 0 0\"><\u002Fdiv><div style=\"flex:1;height:88%;background:#5457BE;border-radius:3px 3px 0 0\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:10px 12px;border-radius:10px;background:rgba(217,162,59,0.12)\"><span style=\"font:400 13px/20px Inter,sans-serif;color:#F2F3F8\">An estimate from metered usage. It is not a bill and will not match the invoice exactly.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Config summary<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Environment<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">testing<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Data source<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#D9A23B\">fixture<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Voice<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">enabled<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Rate-limit keys tracked<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">37<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:12px;padding:10px 16px\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#A3A8C0\">Tool cap<\u002Fspan><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">6 per question<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">\"Rate-limit keys tracked\" is a count of hashed keys. It is never labelled users, visitors or addresses, because it is none of those.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"21 Voice\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">21<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board I — Voice<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">A transcript lands in the composer, editable, and is never sent on the user's behalf.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Record button — 6 states<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"18\" height=\"18\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Idle<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;border:1px solid #383A97;background:#1E2137;display:flex;align-items:center;justify-content:center;color:#E5E5F7\"><svg width=\"18\" height=\"18\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Hover<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"18\" height=\"18\"><use href=\"#i-wave\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Recording 0:12<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;background:#D9A23B;display:flex;align-items:center;justify-content:center;color:#22245E;font:600 12px/16px Inter,sans-serif;font-variant-numeric:tabular-nums\">0:53<\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B;text-align:center\">7 seconds left<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.4);display:flex;align-items:center;justify-content:center;color:#E4736A\"><svg width=\"18\" height=\"18\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Microphone blocked<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:44px;height:44px;border-radius:999px;border:1px dashed #262A42;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"18\" height=\"18\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Voice off<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35)\"><svg width=\"16\" height=\"16\" style=\"color:#E4736A;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Your browser is blocking the microphone for this site. Allow it in the address bar, or type your question instead.<\u002Fspan><\u002Fdiv>\n      <div style=\"padding-top:16px;border-top:1px solid #262A42;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Speech preview — admin only<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><div style=\"width:28px;height:28px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:none\"><svg width=\"14\" height=\"14\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;flex:1\">Preview the voice<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:#262A42;font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#A3A8C0\">Admin only<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Transcription result — 8 states, each error naming its real limit<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6;margin-top:3px\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Working out what you said…<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#1E2137;border:1px solid #383A97\"><svg width=\"16\" height=\"16\" style=\"color:#3BA776;margin-top:3px\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">\"What is wharfage on a forty foot container at Port Zante\"<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A5A7E6\">Placed in the composer. Correct it before sending.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><svg width=\"16\" height=\"16\" style=\"color:#D9A23B;margin-top:3px\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">We could not make out any words. Record again, closer to the microphone.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35)\"><span style=\"font:600 12px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums;flex:none\">422<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">That file type is not supported. Send a WAV, MP3, M4A, OGG or WebM recording.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35)\"><span style=\"font:600 12px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums;flex:none\">413<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">That recording is 26.4 MB. The limit is 20 MB. Record a shorter clip.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35)\"><span style=\"font:600 12px/20px Inter,sans-serif;color:#E4736A;font-variant-numeric:tabular-nums;flex:none\">422<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">That recording is 1 minute 14 seconds. The limit is 60 seconds.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><span style=\"font:600 12px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums;flex:none\">429<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Five recordings a minute is the limit. Try again in 0:26.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#1E2137;border:1px solid #262A42\"><span style=\"font:600 12px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums;flex:none\">503<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Voice is switched off at the moment. You can still type your question.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Playback — 9 states<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Ready<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;background:rgba(56,58,151,0.35);display:flex;align-items:center;justify-content:center;color:#A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Preparing<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-pause\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Playing<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #383A97;display:flex;align-items:center;justify-content:center;color:#A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Paused<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#3BA776\"><svg width=\"16\" height=\"16\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Finished<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#3B9BD9\"><svg width=\"16\" height=\"16\"><use href=\"#i-lightning\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Cached · instant<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-refresh\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Not cached<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center;font-variant-numeric:tabular-nums\">304 unchanged<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:36px;height:36px;border-radius:999px;background:rgba(217,86,75,0.12);display:flex;align-items:center;justify-content:center;color:#E4736A\"><svg width=\"16\" height=\"16\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;text-align:center\">Failed<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"22 Feedback matrix\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">22<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Board J — feedback matrix<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">The cross-cutting states in one grid, so the same event never gets two treatments.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Three rate limits, three copies<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:34px;height:34px;border-radius:999px;background:conic-gradient(#5457BE 0deg 252deg, #262A42 252deg 360deg);display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:26px;height:26px;border-radius:999px;background:#171A2B\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Chat · 15 a minute<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Send again in 0:42<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:34px;height:34px;border-radius:999px;background:conic-gradient(#5457BE 0deg 156deg, #262A42 156deg 360deg);display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:26px;height:26px;border-radius:999px;background:#171A2B\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Voice · 5 a minute<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Record again in 0:26<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:34px;height:34px;border-radius:999px;background:conic-gradient(#5457BE 0deg 108deg, #262A42 108deg 360deg);display:flex;align-items:center;justify-content:center;flex:none\"><div style=\"width:26px;height:26px;border-radius:999px;background:#171A2B\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:1px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Operations · 60 a minute<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Refresh in 0:18<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Each names the action it blocks. The ring is drawn from Retry-After — there is no remaining-quota figure anywhere, because the backend computes it and drops it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Six mandatory notices — none dismissible<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:11px 16px;border-bottom:1px solid #262A42;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Sample data on an operations screen<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:11px 16px;border-bottom:1px solid #262A42;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#6E7490;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">No feed connected<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:11px 16px;border-bottom:1px solid #262A42;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Chart caption — official or illustrative<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:11px 16px;border-bottom:1px solid #262A42;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Quote disclaimer<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:11px 16px;border-bottom:1px solid #262A42;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Demonstration profile<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:11px 16px;display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Spend is an estimate, not a bill<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">No close control, no \"don't show again\", no collapse. Each renders as prominently as the thing it qualifies.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Five empty states — each names the next action<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">No results for these filters<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">→ Clear filters<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">No feed connected<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">→ Telephone 869 465 8121<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Nothing recorded for today<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">→ Try another date<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">No positions reported<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">→ Normal. No AIS is connected.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px;display:flex;flex-direction:column;gap:2px;background:rgba(217,162,59,0.12)\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">No advisory published<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#D9A23B\">→ Not an all-clear. Telephone before sailing.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#1E2137;border:1px solid #262A42;align-self:flex-start\"><div style=\"width:20px;height:20px;border-radius:6px;background:rgba(59,167,118,0.12);display:flex;align-items:center;justify-content:center;color:#3BA776;flex:none\"><svg width=\"12\" height=\"12\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Copied to the clipboard<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Five loading states · announcer<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Skeleton table<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"height:9px;border-radius:5px;background:#1E2137\"><\u002Fspan><span style=\"height:9px;border-radius:5px;background:#1E2137;width:78%\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Streaming tokens<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#F2F3F8\">Wharfage on a 40ft container is<span style=\"display:inline-block;width:7px;height:14px;background:#A5A7E6;vertical-align:-2px;margin-left:3px\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Inline spinner in a button<\u002Fspan><div style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;background:#2C2E7A;color:#FFFFFF;align-self:flex-start\"><span style=\"width:12px;height:12px;border-radius:999px;border:2px solid rgba(255,255,255,0.35);border-top-color:#FFFFFF\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif\">Sending<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Tool running<\u002Fspan><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:6px;height:6px;border-radius:999px;background:#A5A7E6\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A5A7E6\">build_quote running<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Progressive rows<\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">12 of 25 loaded<\u002Fspan><\u002Fdiv>\n        <div style=\"padding-top:12px;border-top:1px solid #262A42;display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Screen-reader announcer<\u002Fspan><p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Polite region announces \"answering\", then the settled answer once — never token by token. Errors and source-kind changes are assertive. Under reduced motion the cursor and spinner hold still and the announcer carries the state instead.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Responsive 390\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">Rs<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Responsive — 390px<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Sidebar collapses behind the panel control. Every target is at least 44px.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:32px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">New question<\u002Fdiv>\n      <div style=\"width:390px;height:760px;background:#10121F;border:1px solid #262A42;border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #262A42\">\n          <div style=\"width:32px;height:32px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none\"><img src=\"4a6de603-608a-4743-a8da-452943413905\" alt=\"SCASPA seal\" style=\"width:24px;height:24px;display:block\"><\u002Fdiv>\n          <div style=\"font:600 15px/20px Inter,sans-serif;color:#F2F3F8;flex:1\">SCASPA Assistant<\u002Fdiv>\n          <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"18\" height=\"18\"><use href=\"#i-panel\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:32px 16px 0;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h3 style=\"font:600 24px/32px Inter,sans-serif;color:#F2F3F8;letter-spacing:-0.01em\">What do you need from the port today?<\u002Fh3>\n            <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Ask one thing at a time. Every answer stands alone.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Ask about a vessel, a flight, a tariff…<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid #383A97;background:rgba(56,58,151,0.35)\"><svg width=\"14\" height=\"14\" style=\"color:#A5A7E6\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Search<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n              <div style=\"width:34px;height:34px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-ship\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Vessels in port<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-plane\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Arrivals today<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-receipt\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Quote a container<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-headset\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Contact a department<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 16px;border-top:1px solid #262A42;display:flex;align-items:center;gap:10px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:#2C2E7A;display:flex;align-items:center;justify-content:center;color:#A5A7E6;flex:none\"><svg width=\"16\" height=\"16\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"flex:1\"><div style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Delroy Warner<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:4px 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;gap:7px\"><span style=\"width:7px;height:7px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Sample data<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Table answer with mobile pagination<\u002Fdiv>\n      <div style=\"width:390px;height:760px;background:#10121F;border:1px solid #262A42;border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #262A42\">\n          <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0;margin-left:-10px\"><svg width=\"18\" height=\"18\"><use href=\"#i-arr-l\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8;flex:1\">Flight arrivals<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden\">\n          <div style=\"display:flex;justify-content:flex-end\"><div style=\"max-width:80%;padding:12px 14px;border-radius:16px;background:rgba(56,58,151,0.32);border:1px solid #383A97\"><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Arrivals into RLB after 13:00<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Four flights are due into Robert L. Bradshaw after 13:00 today.<\u002Fp>\n          <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">AA 2192 · Miami<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">Due 13:05<\u002Fspan><\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:rgba(59,167,118,0.12);flex:none\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Landed<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">LI 631 · Antigua<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">Due 15:20<\u002Fspan><\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;flex:none\"><span style=\"width:6px;height:6px;border-radius:999px;background:#6E7490\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Scheduled<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">BW 456 · Port of Spain<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">Due 16:40<\u002Fspan><\u002Fdiv><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:rgba(217,162,59,0.12);flex:none\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">Delayed<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"padding:14px 16px;border-bottom:1px solid #262A42;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums;text-align:center\">Showing 1–25 of 100<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <div style=\"flex:1;height:44px;border-radius:10px;border:1px solid #1E2137;display:flex;align-items:center;justify-content:center;gap:8px;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-l\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif\">Previous<\u002Fspan><\u002Fdiv>\n                <div style=\"flex:1;height:44px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;gap:8px;color:#A3A8C0\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Next<\u002Fspan><svg width=\"16\" height=\"16\"><use href=\"#i-arr-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 16px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">Check flight arrivals<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:4px\">\n            <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"18\" height=\"18\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"18\" height=\"18\"><use href=\"#i-thumb\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"18\" height=\"18\" style=\"transform:rotate(180deg)\"><use href=\"#i-thumb\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"18\" height=\"18\"><use href=\"#i-refresh\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Receipt and unpriced quote<\u002Fdiv>\n      <div style=\"width:390px;height:760px;background:#10121F;border:1px solid #262A42;border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n        <div style=\"height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #262A42\">\n          <div style=\"display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 8px;border-radius:10px;border:1px solid #262A42\"><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-arr-l\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#A5A7E6\">Enquiry form<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden\">\n          <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:36px;height:36px;border-radius:999px;background:rgba(59,167,118,0.12);display:flex;align-items:center;justify-content:center;color:#3BA776;flex:none\"><svg width=\"18\" height=\"18\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Enquiry received<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:16px;border-radius:12px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Your reference<\u002Fspan><span style=\"font:600 24px/32px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums;letter-spacing:0.02em\">SC-4821<\u002Fspan><\u002Fdiv>\n              <div style=\"width:44px;height:44px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0;flex:none\"><svg width=\"18\" height=\"18\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Quote this reference when you telephone the department. It cannot be looked up online.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Wharfage<\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">2,232.00<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8\">Berthage<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:rgba(217,86,75,0.12)\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9564B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">Not priced<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"padding:12px 14px;border-radius:12px;background:rgba(217,86,75,0.12);border:1px solid rgba(217,86,75,0.35);display:flex;gap:10px;align-items:flex-start\"><svg width=\"16\" height=\"16\" style=\"color:#E4736A;margin-top:3px\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">This quote is incomplete. Berthage has no published rate.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid #262A42\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Total so far<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#E4736A\">1 charge missing<\u002Fspan><\u002Fdiv><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">XCD 7,560.00<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Out of scope\" style=\"display:flex;flex-direction:column;gap:24px;padding:64px 0 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">Nb<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Deliberately not designed<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Nothing stands behind these. Drawing them would promise something the product cannot do.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Rebuild index, job status<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The offline scripts have no trigger and no progress. Their only visible trace is the version string on the admin screen.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Email, extensions, web contact<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Telephone and post only. No staff extension directory.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Per-endpoint spend<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Three categories, no drill-down. Legend rows are not links.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Quota meter<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">No \"questions remaining this minute\". The 429 countdown is the only rate signal that exists.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Paging on ops lists<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Positions, gates and advisories return complete. Count and filter, nothing more.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Ticket status lookup<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The reference is for quoting on the telephone. There is nothing to look it up against.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Conversational memory<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">No \"continue where we left off\", no restored history, no \"clear this conversation\". Each turn stands alone and the greeting says so.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">A softer 404<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">No lock, no sign-in prompt, no \"you may not have access\". One 404, byte for byte.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid rgba(217,86,75,0.35);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Sign-in, sessions, accounts, \"current user\"<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The backend has no accounts and never knows who is asking. The sidebar's bottom row is a demonstration profile with an always-true demo flag, precisely so it cannot quietly become an identity.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showAnnotations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;},&quot;showBlockedFlags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Board&quot;},&quot;coverDataState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fixture&quot;,&quot;live&quot;,&quot;unavailable&quot;],&quot;default&quot;:&quot;fixture&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cover shell&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.props.coverDataState || 'fixture';\n    return {\n      ann: this.props.showAnnotations ?? true,\n      blocked: this.props.showBlockedFlags ?? true,\n      isFixture: st === 'fixture',\n      isLive: st === 'live',\n      isDown: st === 'unavailable'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
