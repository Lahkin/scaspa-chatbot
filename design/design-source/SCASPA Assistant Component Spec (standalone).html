document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s two data paths that must never look alike — model prose and the operations feed — and the whole system is built around telling them apart. Seven components are marked blocked; each names the field the backend must return before it can ship.<\u002Fp>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;padding-top:4px\">\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">A · Foundations · 00–00d<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">B · Shell and navigation · 01–04<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">C · Chat · 05, 13–15<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">D · Structured blocks · 16<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">E · Vessels and Flights · 07, 17<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">F · Tariffs · 09, 18<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">G · Support · 08, 11, 19<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">H · Console and admin · 10, 12, 20<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">I · Voice · 21<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">J · Feedback matrix · 22<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;flex:none\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 18px;background:#171A2B;border:1px solid #262A42;border-radius:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Shell<\u002Fdiv><div style=\"font:600 15px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">1440 · 390<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 18px;background:#171A2B;border:1px solid #262A42;border-radius:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Boards<\u002Fdiv><div style=\"font:600 15px/20px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">A – J<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px;padding:14px 18px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3);border-radius:12px\"><div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#D9A23B\">Blocked<\u002Fdiv><div style=\"font:600 15px/20px Inter,sans-serif;color:#D9A23B;font-variant-numeric:tabular-nums\">7<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"Cover — app shell 1440\" style=\"display:flex;flex-direction:column;gap:24px;padding:0 0 72px\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">Sh<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">App shell — 1440px<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Cover frame only: the shell floats over an ambient bloom. Inside the product there is no gradient.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;border-radius:24px;overflow:hidden;background:#05060D;padding:80px;display:flex;justify-content:center\">\n    <div style=\"position:absolute;left:50%;top:-180px;width:1100px;height:700px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%, rgba(84,87,190,0.55) 0%, rgba(56,58,151,0.28) 42%, rgba(10,11,20,0) 72%)\"><\u002Fdiv>\n    <div style=\"position:absolute;left:12%;bottom:-220px;width:760px;height:520px;background:radial-gradient(50% 50% at 50% 50%, rgba(59,155,217,0.22) 0%, rgba(10,11,20,0) 70%)\"><\u002Fdiv>\n\n    <div style=\"position:relative;width:1440px;height:900px;display:flex;background:#10121F;border:1px solid #262A42;border-radius:20px;overflow:hidden\">\n\n      <aside style=\"width:240px;flex:none;background:#171A2B;border-right:1px solid #262A42;display:flex;flex-direction:column;padding:16px 12px 12px\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:0 2px 16px\">\n          <div style=\"width:40px;height:40px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none\"><img src=\"4a6de603-608a-4743-a8da-452943413905\" alt=\"SCASPA seal\" style =\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Is the Vega Sirius alongside?<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Wharfage on a 40ft container<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Arrivals into RLB after 14:00<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Who handles cruise berthing?<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Tonnage dues for a 12,000 GT ship<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Gate for LI 631 this evening<\u002Fdiv>\n            <div style=\"height:32px;padding:0 10px;display:flex;align-items:center;border-radius:10px;font:400 13px/18px Inter,sans-serif;color:#A3A8C0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Postal address for marine ops<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to bottom, rgba(23,26,43,0) 0%, #171A2B 82%);pointer-events:none\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isFixture }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:12px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#D9A23B;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Sample data — not live<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Figures come from the test fixture. Do not quote them to a customer.<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isLive }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:12px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;background:#3B9BD9;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Live data<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Refreshed 14:32 AST<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isDown }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:12px;padding:12px;background:#1E2137;border:1px solid #262A42;border-radius:12px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:999px;border:1.5px solid #6E7490;flex:none\"><\u002Fspan><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">No feed connected<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Last known 06:10 AST, 1 Aug<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #262A42;display:flex;align-items:center;gap:10px\">\n          <div style=\"width:28px;height:28px;border-radius:999px;background:#1E2137;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#7A7CD6;flex:none\"><svg width=\"16\" height=\"16\"><use href=\"#i-anchor\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"flex:1;min-width:0\">\n            <div style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Basseterre operator<\u002Fdiv>\n            <div style=\"font:500 11px/14px Inter,sans-serif;color:#6E7490;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Demonstration profile<\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;color:#D9A23B;flex:none\">DEMO<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <main style=\"flex:1;min-width:0;background:#10121F;display:flex;flex-direction:column\">\n        <div style=\"height:60px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid #262A42\">\n          <div style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;flex:1\">New question<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;background:rgba(217,162,59,0.12);border:1px solid rgba(217,162,59,0.3)\"><svg width=\"16\" height=\"16\" style=\"color:#D9A23B\"><use href=\"#i-mega\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#D9A23B\">2 advisories<\u002Fspan><\u002Fdiv>\n          <div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <div style=\"width:32px;height:32px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-kebab\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;display:flex;justify-content:center;padding:132px 28px 0\">\n          <div style=\"width:720px;display:flex;flex-direction:column;gap:24px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <h3 style=\"font:600 30px/38px Inter,sans-serif;color:#F2F3F8;letter-spacing:-0.01em\">What do you need from the port today?<\u002Fh3>\n              <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0\">Ask one thing at a time. Every answer stands alone — this assistant does not carry anything over from your last question.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Ask about a vessel, a flight, a tariff or a department…<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0;border:1px solid #262A42\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid #383A97;background:rgba(56,58,151,0.35)\"><svg width=\"14\" height=\"14\" style=\"color:#A5A7E6\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Search records<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#A3A8C0\"><use href=\"#i-receipt\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0\">Tariff quote<\u002Fspan><\u002Fdiv>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div style=\"width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n                <div style=\"width:34px;height:34px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-ship\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Vessels in port<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-plane\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Arrivals today<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-receipt\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Quote a container<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-anchor\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Berth positions<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-mega\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Port advisories<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-gate\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Gate assignments<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-headset\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Contact a department<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Cruise call times<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;gap:32px;padding-top:4px\">\n    <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490;flex:1\">Depth comes from surface lightness only — canvas <span style=\"color:#A3A8C0\">#0A0B14<\u002Fspan>, main column <span style=\"color:#A3A8C0\">#10121F<\u002Fspan>, sidebar and cards <span style=\"color:#A3A8C0\">#171A2B<\u002Fspan>, composer and inputs <span style=\"color:#A3A8C0\">#1E2137<\u002Fspan>. No drop shadows anywhere inside the frame.<\u002Fp>\n    <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490;flex:1\">Recent questions re-ask the question; they do not restore a conversation. The greeting says so in plain words, so nothing in the shell implies the assistant remembers the previous turn.<\u002Fp>\n    <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490;flex:1\">The seal is dark blue line art on transparency. It always sits on a white circular plate — 32px seal inside a 40px plate here. Never recoloured, outlined, cropped or knocked out to white.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<section data-screen-label=\"00a Embedded widget\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">00a<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Embedded widget — the same shell without the sidebar<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Dropped into the Authority's own pages. Navigation goes; provenance does not.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n    <div style=\"width:420px;height:560px;background:#10121F;border:1px solid #262A42;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;flex:none\">\n      <div style=\"height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #262A42\">\n        <div style=\"width:32px;height:32px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none\"><img src=\"4a6de603-608a-4743-a8da-452943413905\" alt=\"SCASPA seal\" style=\"width:24px;height:24px;display:block\"><\u002Fdiv>\n        <div style=\"font:600 15px/20px Inter,sans-serif;color:#F2F3F8;flex:1\">SCASPA Assistant<\u002Fdiv>\n        <div style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#D9A23B;flex:none\"><svg width=\"12\" height=\"12\" style=\"color:#22245E\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#22245E\">Sample data<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">What do you need from the port?<\u002Fspan>\n          <span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Ask one thing at a time. Each answer stands alone.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-ship\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Vessels in port<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:#171A2B;border:1px solid #262A42\"><svg width=\"14\" height=\"14\" style=\"color:#7A7CD6\"><use href=\"#i-receipt\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Quote a container<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:12px 16px;border-top:1px solid #262A42\">\n        <div style=\"background:#1E2137;border:1px solid #262A42;border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Ask a question…<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:30px;height:30px;border-radius:10px;border:1px solid #262A42;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-clip\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"flex:1\"><\u002Fdiv><div style=\"width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A3A8C0\"><svg width=\"16\" height=\"16\"><use href=\"#i-mic\"><\u002Fuse><\u002Fsvg><\u002Fdiv><div style=\"width:32px;height:32px;border-radius:999px;background:#383A97;display:flex;align-items:center;justify-content:center;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-u\"><\u002Fuse><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:380px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">What changes, and what does not<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Dropped<\u002Fspan>\n            <span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Sidebar, primary nav, recorded questions, screen title row, secondary actions. The host page owns navigation.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Kept, without exception<\u002Fspan>\n            <span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The seal on its plate, the source-kind badge in the header, every provenance card and meta strip, every mandatory notice, and the escalation block on refusals.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The status card has nowhere to sit once the sidebar goes, so the source-kind badge moves into the widget header. Embedding is not a reason to lose the one thing that says whether the figures are real.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Sizing<\u002Fdiv>\n        <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">380 – 560px wide<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">content well shrinks from 720 to fill<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">480px minimum height<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">composer pinned, answers scroll<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Tables become row cards<\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">below 640px, as on mobile<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"00 Foundations\" style=\"display:flex;flex-direction:column;gap:36px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">00<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Foundations<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Measured contrast, not claimed contrast. Every ratio below is against the surface named beneath it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Brand — from the seal<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:12px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\"><div style=\"hei annot tell you whether a particular ship has berthed <span style=\"font:500 12px/16px Inter,sans-serif;color:#7A7CD6;font-variant-numeric:tabular-nums;vertical-align:1px\">kb-002<\u002Fspan>.<\u002Fp>\n        <span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">No card. No border. No meta strip. No timestamp.<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Prose sits flush on surface-1 and carries citations, nothing else. It is never given a card, because a card in this product is a claim of provenance and a model cannot make one. The dashed outline above is board annotation only — it does not ship.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Operations path · /api/vessels · provenance card<\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;background:#1E2137;border-bottom:1px solid #262A42;flex-wrap:wrap\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#D9A23B\"><svg width=\"12\" height=\"12\" style=\"color:#22245E\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#22245E\">Sample data<\u002Fspan><\u002Fspan>\n          <span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Vessel movements fixture<\u002Fspan>\n          <span style=\"width:3px;height:3px;border-radius:999px;background:#6E7490\"><\u002Fspan>\n          <span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">as of 06:10 AST, 1 Aug 2026<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:12px 16px;border-bottom:1px solid #262A42;background:rgba(217,162,59,0.12)\"><span style=\"font:400 13px/20px Inter,sans-serif;color:#F2F3F8\">These rows are sample data loaded for testing. Do not quote them to a customer.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.5fr 0.9fr 0.8fr 1fr;padding:10px 16px;border-bottom:1px solid #262A42\"><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Vessel<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Berth<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">ETA<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Status<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.5fr 0.9fr 0.8fr 1fr;padding:11px 16px;align-items:center;border-bottom:1px solid #262A42\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">Vega Sirius<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Berth 2<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">06:40<\u002Fspan><span><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(59,167,118,0.45)\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Alongside<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.5fr 0.9fr 0.8fr 1fr;padding:11px 16px;align-items:center\"><span style=\"font:500 13px/20px Inter,sans-serif;color:#F2F3F8\">Seaboard Ocean<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">Berth 1<\u002Fspan><span style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;font-variant-numeric:tabular-nums\">11:15<\u002Fspan><span><span style=\"display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(217,162,59,0.45)\"><span style=\"width:6px;height:6px;border-radius:999px;background:#D9A23B\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#D9A23B\">Expected<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">Every operations payload carries a DataSource object, so every operations block carries a meta strip: source-kind badge, label, as_of. When kind is fixture or unavailable the notice below it is schema-required and non-dismissible.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:rgba(56,58,151,0.22);border:1px solid #383A97\">\n    <svg width=\"16\" height=\"16\" style=\"color:#A5A7E6;margin-top:3px\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg>\n    <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0;max-width:1080px\">The two blocks above will regularly appear one under the other in the same turn — prose saying <span style=\"color:#F2F3F8\">\"I cannot see live movements\"<\u002Fspan> directly above a board of movements. That is correct behaviour, not a contradiction, and the layout must never imply the prose is summarising the rows. They are separated by 24px, the prose never sits inside the card, and the card's meta strip states its own source independently.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"00c Badge families\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">00c<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Badge families<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">Nine enum families, about forty-five variants. Shape carries the family, hue carries severity within it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#3B9BD9\"><svg width=\"12\" height=\"12\" style=\"color:#0A0B14\"><use href=\"#i-lightning\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#0A0B14\">Live feed<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Provenance<\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Filled, icon-led, 11px uppercase. The loudest treatment in the system — provenance outranks operational status, because a wrong status is a mistake and a wrong source is a lie.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;border:1px solid rgba(59,167,118,0.45)\"><span style=\"width:6px;height:6px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Alongside<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Operational status<\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Outline pill, 6px leading dot, sentence case. Deliberately quieter. Sits in table cells by the hundred, so it must not shout.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"display:inline-flex;align-items:center;height:28px;padding:0 14px;border-radius:999px;background:#1E2137;border:1px solid #262A42;font:500 13px/18px Inter,sans-serif;color:#A3A8C0\">Berthing<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#383A97;font:500 13px/18px Inter,sans-serif;color:#FFFFFF\"><svg width=\"12\" height=\"12\"><use href=\"#i-check\"><\u002Fuse><\u002Fsvg>Tariffs<\u002Fspan><\u002Fdiv>\n      <div style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Filter and category<\u002Fdiv>\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Ghost pill with a real affordance — 28px tall, hover fill, filled brand-500 when selected. Taller and tappable so it never reads as a status sitting in the same row.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Provenance family — 7 enums<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">source.kind<\u002Fspan><div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#3B9BD9\"><svg width=\"12\" height=\"12\" style=\"color:#0A0B14\"><use href=\"#i-lightning\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#0A0B14\">Live feed<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#D9A23B\"><svg width=\"12\" height=\"12\" style=\"color:#22245E\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#22245E\">Sample data<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#6E7490\"><svg width=\"12\" height=\"12\" style=\"color:#0A0B14\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#0A0B14\">No feed<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:#262A42\"><svg width=\"12\" height=\"12\" style=\"color:#A3A8C0\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.04em;text-transform:uppercase;color:#A3A8C0\">Not connected<\u002Fspan><\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;background:rgba(217,162,59,0.12);font:600 11px/16px Inter,sans-serif;color:#D9A23B\">live blocked<\u002Fspan>\n        <\u002Fdiv><\u002Fdiv>\n        <div style=\"display:fl 22px Inter,sans-serif;color:#6E7490\">Three states. The difference between the second and third must be invisible from outside.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(59,167,118,0.12);font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#3BA776\">State A<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Route present · authenticated<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#10121F;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #262A42\"><div style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;flex:1\">Assistant statistics<\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">Last 30 days<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:24px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n            <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Questions answered<\u002Fspan><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">1,284<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Median response<\u002Fspan><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">2.4s<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Answers with no match<\u002Fspan><span style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">96<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;background:#171A2B;border:1px solid #262A42;border-radius:12px;padding:14px 16px\">\n            <span style=\"font:500 13px/18px Inter,sans-serif;color:#A3A8C0\">Search index<\u002Fspan>\n            <span style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">v4.2.0 · built 28 Jul 2026<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ann }}\" hint-placeholder-val=\"{{ true }}\">\n      <p style=\"font:400 13px/20px Inter,sans-serif;color:#6E7490\">The index version string is the only visible trace of the offline scripts. There is no rebuild trigger, no progress bar and no job status — none of that exists behind the screen.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#1E2137;border:1px solid #262A42;font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#A3A8C0\">State B<\u002Fspan><span style=\"display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#1E2137;border:1px solid #262A42;font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#A3A8C0\">State C<\u002Fspan><span style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Unauthenticated · route absent · mistyped URL<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#10121F;border:1px solid #262A42;border-radius:16px;overflow:hidden\">\n        <div style=\"height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid #262A42\"><div style=\"width:32px;height:32px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none\"><img src=\"4a6de603-608a-4743-a8da-452943413905\" alt=\"SCASPA seal\" style=\"width:24px;height:24px;display:block\"><\u002Fdiv><div style=\"font:600 15px/20px Inter,sans-serif;color:#F2F3F8\">SCASPA Assistant<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:56px 24px 64px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center\">\n          <div style=\"font:600 30px/38px Inter,sans-serif;color:#F2F3F8\">Page not found<\u002Fdiv>\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#A3A8C0;max-width:360px\">We could not find that page. Check the address, or go back and ask the assistant.<\u002Fp>\n          <div style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;background:#383A97;color:#FFFFFF\"><svg width=\"16\" height=\"16\"><use href=\"#i-arr-l\"><\u002Fuse><\u002Fsvg><span style=\"font:500 14px/22px Inter,sans-serif\">Back to the assistant<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:rgba(56,58,151,0.22);border:1px solid #383A97\">\n        <svg width=\"16\" height=\"16\" style=\"color:#A5A7E6;margin-top:3px\"><use href=\"#i-info\"><\u002Fuse><\u002Fsvg>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Drawn once because it ships once. An unauthenticated visitor to <span style=\"color:#F2F3F8\">/admin/stats<\u002Fspan> and a visitor to <span style=\"color:#F2F3F8\">/adnim<\u002Fspan> get the same status code, the same markup and the same copy. No lock icon, no \"sign in to continue\", no softer wording — <span style=\"color:#F2F3F8\">any difference between the two confirms the address exists.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">State C — navigation<\u002Fdiv>\n      <div style=\"width:240px;background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490;padding:4px 8px 8px\">Operations<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:#A3A8C0\"><svg width=\"18\" height=\"18\"><use href=\"#i-anchor\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif\">Berth positions<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:#A3A8C0\"><svg width=\"18\" height=\"18\"><use href=\"#i-gate\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif\">Gate assignments<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:#A3A8C0\"><svg width=\"18\" height=\"18\"><use href=\"#i-mega\"><\u002Fuse><\u002Fsvg><span style=\"font:500 13px/18px Inter,sans-serif\">Advisories<\u002Fspan><\u002Fdiv>\n        <div style=\"height:34px;border-radius:10px;border:1px dashed #262A42;display:flex;align-items:center;justify-content:center;margin-top:6px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">no admin entry<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Rules for the wrapper<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Route present, authenticated<\u002Fdiv><p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The stats screen renders in the ordinary shell. Nothing about it is styled as a privileged area.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Route present, unauthenticated<\u002Fdiv><p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Render the ordinary 404. Do not redirect to a sign-in page — a redirect is itself a disclosure.<\u002Fp><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:500 13px/18px Inter,sans-serif;color:#F2F3F8\">Route absent<\u002Fdiv><p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">The route is not built. No nav item, no link, no keyboard shortcut, nothing in the search field returns it.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Assistant answer card\" style=\"display:flex;flex-direction:column;gap:32px;padding:64px 0;border-top:1px solid #262A42\">\n  <div style=\"display:flex;align-items:baseline;gap:16px\">\n    <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#7A7CD6;font-variant-numeric:tabular-nums;width:28px;flex:none\">05<\u002Fdiv>\n    <h2 style=\"font:600 20px/28px Inter,sans-serif;color:#F2F3F8\">Assistant answer card and its states<\u002Fh2>\n    <p style=\"font:400 14px/22px Inter,sans-serif;color:#6E7490\">The card the assistant returns inside a chat turn. Eight states, two of them blocked.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:720px 1fr;gap:40px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Standard answer — in a chat turn<\u002Fdiv>\n      <div style=\"background:#10121F;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:24px\">\n        <div style=\"display:flex;justify-content:flex-end\">\n          <div style=\"max-width:74%;padding:12px 16px;border-radius:16px;background:rgba(56,58,151,0.32);border:1px solid #383A97\"><span style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Is the Vega Sirius alongside yet, and at which berth?<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font:400 14px/22px Inter,sans-serif;color:#F2F3F8\">Yes. Vega Sirius came alongside Berth 2 at Basseterre at 06:40 AST this morning and is working containers. Departure is booked for 19:00 AST.<\u002Fp>\n          <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:20px 24px 0;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 16px/24px Inter,sans-serif;color:#F2F3F8\">Vega Sirius<\u002Fspan><span style=\"font:400 13px/18px Inter,sans-serif;color:#A3A8C0\">Container · IMO 9432107 · Agent: Delisle Walwyn<\u002Fspan><\u002Fdiv>\n              <span style=\"display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:rgba(59,167,118,0.12);flex:none\"><span style=\"width:7px;height:7px;border-radius:999px;background:#3BA776\"><\u002Fspan><span style=\"font:500 12px/16px Inter,sans-serif;color:#3BA776\">Alongside<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Berth<\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">Berth 2<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Arrived<\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">06:40 AST<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 12px/16px Inter,sans-serif;color:#A3A8C0\">Booked departure<\u002Fspan><span style=\"font:500 14px/22px Inter,sans-serif;color:#F2F3F8;font-variant-numeric:tabular-nums\">19:00 AST<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"14\" style=\"color:#6E7490\"><use href=\"#i-clock\"><\u002Fuse><\u002Fsvg><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490;font-variant-numeric:tabular-nums\">As of 14:32 AST, 1 August 2026 · vessel movements record<\u002Fspan><\u002Fdiv>\n            <div style=\"border-top:1px solid #262A42;display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px\"><span style=\"font:500 14px/22px Inter,sans-serif;color:#A5A7E6\">See all vessel movements<\u002Fspan><svg width=\"16\" height=\"16\" style=\"color:#A5A7E6\"><use href=\"#i-chev-r\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:4px\">\n            <div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-edit\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-thumb\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\" style=\"transform:rotate(180deg)\"><use href=\"#i-thumb\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n            <div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-refresh\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:28px\">\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Turn pattern<\u002Fdiv>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">User turns are right-aligned tinted bubbles at brand-500 32%. Assistant turns are flush left with no bubble — the card is the only bounded thing in the column, so a card always means structured data behind it.<\u002Fp>\n        <p style=\"font:400 13px/20px Inter,sans-serif;color:#A3A8C0\">Every card carries exactly one \"as of\" line and at most one footer link. If an answer has no timestamp to give, the line is removed, not left blank.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#171A2B;border:1px solid #262A42;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"font:600 11px/16px Inter,sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#6E7490\">Ghost icon-button states<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6E7490\"><svg width=\"16\" height=\"16\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Default<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:28px;height:28px;border-radius:8px;background:#1E2137;display:flex;align-items:center;justify-content:center;color:#F2F3F8\"><svg width=\"16\" height=\"16\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font:500 12px/16px Inter,sans-serif;color:#6E7490\">Hover<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\"><div style=\"width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#F2F3F8;box-shadow:0 0 0 2px #171A2B, 0 0 0 4px #A5A7E6\"><svg width=\"16\" height=\"16\"><use href=\"#i-copy\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"fon
