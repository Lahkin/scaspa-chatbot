name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the lock file. If package.json and the lock
      # disagree it fails, which is the point.
      - name: Install
        run: npm ci

      # The route tree is generated by the Vite plugin and gitignored, so it must
      # exist before typecheck. Building first produces it.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No backend runs in CI. Every test goes through MSW, and an unmocked
      # request is a hard failure by design.
      - name: Test
        run: npm run test

      # Fails the build when the budget is exceeded. A budget nobody enforces is
      # a preference — and every kilobyte here is money on a roaming plan.
      - name: Performance budget
        run: npm run check:budget
