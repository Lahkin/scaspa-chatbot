name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the lock file. If package.json and the lock
      # disagree it fails, which is the point.
      - name: Install
        run: npm ci

      # MUST come first, and `build` is `vite build` alone rather than
      # `tsc --noEmit && vite build`.
      #
      # `src/routeTree.gen.ts` is generated by the Vite plugin and is gitignored,
      # so on a clean checkout it does not exist. Running tsc before Vite means
      # typechecking a project whose route tree has not been generated yet, and
      # every route file fails. It passed locally for the whole build because the
      # file was already there from the first `npm run dev` — a clean checkout is
      # the only thing that shows it, which is exactly what CI is for.
      #
      # `vite-plugin-checker` typechecks during the build and fails it on a type
      # error, so nothing is lost by dropping tsc from the build script; the
      # Typecheck step below then runs against a generated tree.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # No backend runs in CI. Every test goes through MSW, and an unmocked
      # request is a hard failure by design.
      - name: Test
        run: npm run test

      # Fails the build when the budget is exceeded. A budget nobody enforces is
      # a preference — and every kilobyte here is money on a roaming plan.
      - name: Performance budget
        run: npm run check:budget
